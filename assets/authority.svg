<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title"><title id="title">Original interpretation of historical authority boundaries</title><rect width="1280" height="430" rx="24" fill="#111c23"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="59" font-size="23" fill="#62d8c4" >ADVICE NEEDS AN EXPLICIT ROUTE INTO STATE</text><rect x="48" y="100" width="360" height="180" rx="18" fill="#1b2b33" stroke="#365052"/><text x="74" y="145" font-size="21" fill="#62d8c4" >PROPOSE</text><text x="74" y="194" font-size="23" fill="#f5f3ec" >Advisory content</text><text x="74" y="235" font-size="17" fill="#b9c8ca" >Can suggest a change</text><path d="M413 192h34m-8-7 8 7-8 7" fill="none" stroke="#62d8c4" stroke-width="2"/><rect x="456" y="100" width="360" height="180" rx="18" fill="#1b2b33" stroke="#365052"/><text x="482" y="145" font-size="21" fill="#62d8c4" >CHECK + DECIDE</text><text x="482" y="194" font-size="23" fill="#f5f3ec" >Contracts and human gates</text><text x="482" y="235" font-size="17" fill="#b9c8ca" >Determine admitted scope</text><path d="M821 192h34m-8-7 8 7-8 7" fill="none" stroke="#62d8c4" stroke-width="2"/><rect x="864" y="100" width="360" height="180" rx="18" fill="#1b2b33" stroke="#365052"/><text x="890" y="145" font-size="21" fill="#62d8c4" >COMMIT STATE</text><text x="890" y="194" font-size="23" fill="#f5f3ec" >Authoritative work package</text><text x="890" y="235" font-size="17" fill="#b9c8ca" >Carries traceable identity</text><text x="48" y="347" font-size="19" fill="#b9c8ca" >Original curatorial interpretation of design intent.</text><text x="48" y="380" font-size="19" fill="#b9c8ca" >A diagram of intended roles does not prove whole-system implementation.</text></g></svg>
